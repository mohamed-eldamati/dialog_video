<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dialog – Video</title>
<style>
:root{--bg:#eef2fb;--tx:#1d2233;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12152a;--tx:#f0f2fb}}
:root[data-theme="dark"]{--bg:#12152a;--tx:#f0f2fb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:900px;margin:auto;padding:12px}
#tabs{display:flex;gap:8px;margin-bottom:10px}
#tabs button{flex:1;padding:10px;border:0;border-radius:14px;font-weight:800;font-size:clamp(14px,4vw,18px);cursor:pointer;background:#cfd6ea;color:#1d2233}
#tabs button.on{background:#3d5afe;color:#fff}
#stage{position:relative;border-radius:22px;overflow:hidden;padding:14px 10px 0;transition:background .6s}
#stage.s1{background:linear-gradient(#ffe9b8,#bfe3ff 60%,#9ad47a 60%)}
#stage.s2{background:linear-gradient(#dfe6f3,#c4cde0 62%,#8a93a8 62%)}
#chars{display:flex;justify-content:space-around;align-items:flex-end;height:150px}
.ch{text-align:center;transition:transform .25s,filter .25s;filter:grayscale(.5) brightness(.9);position:relative}
.ch .f{font-size:84px;line-height:1}
.ch .n{display:inline-block;background:rgba(255,255,255,.85);color:#1d2233;font-weight:800;border-radius:12px;padding:1px 12px;font-size:16px}
.ch.talk{filter:none;transform:scale(1.12)}
.ch.talk .f{animation:tk .35s infinite alternate}
@keyframes tk{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-8px) rotate(3deg)}}
.wave{position:absolute;top:-6px;right:-6px;font-size:34px;display:none;animation:w .5s infinite alternate}
.ch.talk .wave.on{display:block}
@keyframes w{from{transform:rotate(-20deg)}to{transform:rotate(25deg)}}
#log{background:rgba(255,255,255,.55);margin:0 -10px;padding:12px 12px 16px;min-height:300px;display:flex;flex-direction:column;gap:8px}
.b{max-width:86%;padding:10px 16px;border-radius:18px;font-weight:800;font-size:clamp(17px,4.6vw,26px);animation:in .35s;border:2px solid;color:#1d2233}
.b.A{align-self:flex-start;background:#e3f0ff;border-color:#3b82d6}
.b.B{align-self:flex-end;background:#fff1de;border-color:#e08a22}
.b.old{opacity:.6}
.b.hide{color:transparent;text-shadow:none;user-select:none}
.b.hide::after{content:"🔊 ···";color:#555;position:absolute}
.b{position:relative}
@keyframes in{from{transform:translateY(14px) scale(.9);opacity:0}to{transform:none;opacity:1}}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
#bar button{border:0;border-radius:30px;padding:12px 22px;font-size:18px;font-weight:800;cursor:pointer;background:#3d5afe;color:#fff}
#bar label{font-weight:700;display:flex;gap:6px;align-items:center}
#prog{height:8px;background:#cfd6ea;border-radius:8px;margin-top:10px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:#3d5afe;transition:width .4s}
</style>
</head>
<body>
<main>
<div id="tabs"><button id="t1">Karte 1 · du</button><button id="t2">Karte 2 · Sie</button></div>
<div id="stage" class="s1">
  <div id="chars">
    <div class="ch" id="cA"><span class="wave" id="wA">👋</span><div class="f" id="fA">👦</div><span class="n" id="nA">Ali</span></div>
    <div class="ch" id="cB"><span class="wave" id="wB">👋</span><div class="f" id="fB">👧</div><span class="n" id="nB">Sara</span></div>
  </div>
  <div id="log"></div>
</div>
<div id="prog"><i id="pi"></i></div>
<div id="bar">
  <button id="pl">▶ Start</button>
  <label>Tempo <input type="range" id="sp" min="0.6" max="1.1" step="0.1" value="0.85"></label>
  <label><input type="checkbox" id="tx" checked> Text</label>
</div>
<div id="vo" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
  <label style="flex:1;min-width:200px;font-weight:700">🎙️ <span id="lA">Ali</span><br><select id="sA" style="width:100%;padding:8px;border-radius:10px"></select></label>
  <label style="flex:1;min-width:200px;font-weight:700">🎙️ <span id="lB">Sara</span><br><select id="sB" style="width:100%;padding:8px;border-radius:10px"></select></label>
  <button id="sw" style="border:0;border-radius:30px;padding:10px 18px;font-weight:800;cursor:pointer;background:#cfd6ea;color:#1d2233;align-self:flex-end">🔄 Stimmen tauschen</button>
</div>
</main>
<script>
var D=[
{cls:"s1",A:["👦","Ali"],B:["👧","Sara"],L:[["A","Guten Morgen! Wie heißt du?"],["B","Ich heiße Sara. Und du?"],["A","Ich bin Ali."],["B","Wie geht's dir?"],["A","Danke, gut. Und dir?"],["B","Ganz gut, danke!"],["A","Tschüs!"],["B","Ciao!"]]},
{cls:"s2",A:["👨‍💼","Herr Schmidt"],B:["👩‍💼","Frau Müller"],L:[["A","Guten Tag! Wie ist Ihr Name?"],["B","Mein Name ist Müller. Und Ihr Name?"],["A","Ich heiße Schmidt."],["B","Wie geht es Ihnen?"],["A","Danke, sehr gut. Und Ihnen?"],["B","Auch gut, danke."],["A","Auf Wiedersehen!"],["B","Auf Wiedersehen!"]]}];
var $=function(i){return document.getElementById(i)};
var cur=0,run=0,playing=false,voices=[];
var FEM=/anna|petra|marlene|vicki|hedda|katja|amala|helena|steffi|sabine|female|weiblich|google deutsch|karen|ingrid|vera|lena/i;
var MAL=/markus|yannick|stefan|conrad|killian|hans|daniel|jonas|florian|bernd|reed|martin|thomas|klaus|viktor|\bmale\b|m\u00e4nnlich|jan\b|max\b/i;
function gen(v){var n=v.name;return FEM.test(n)?"f":MAL.test(n)?"m":"?"}
function loadV(){
  try{voices=speechSynthesis.getVoices().filter(function(v){return /^de/i.test(v.lang)})}catch(e){}
  if(!voices.length)return;
  var sA=$("sA"),sB=$("sB");sA.innerHTML="";sB.innerHTML="";
  voices.forEach(function(v,i){var g=gen(v),t=(g=="m"?"\u2642 ":g=="f"?"\u2640 ":"")+v.name;
    [sA,sB].forEach(function(s){var o=document.createElement("option");o.value=i;o.textContent=t;s.appendChild(o)})});
  var m=-1,f=-1;
  voices.forEach(function(v,i){var g=gen(v);if(g=="m"&&m<0)m=i;if(g=="f"&&f<0)f=i});
  if(m<0)m=f==0&&voices.length>1?1:0;
  if(f<0)f=m==0&&voices.length>1?1:0;
  sA.value=m;sB.value=f;
}
loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}
function setup(k){
  cur=k;run++;playing=false;try{speechSynthesis.cancel()}catch(e){}
  var d=D[k];$("stage").className=d.cls;
  $("lA").textContent=d.A[1];$("lB").textContent=d.B[1];
  $("fA").textContent=d.A[0];$("nA").textContent=d.A[1];$("fB").textContent=d.B[0];$("nB").textContent=d.B[1];
  $("log").innerHTML="";$("pi").style.width="0";$("pl").textContent="▶ Start";
  $("cA").classList.remove("talk");$("cB").classList.remove("talk");
  $("t1").className=k==0?"on":"";$("t2").className=k==1?"on":"";
}
function speak(t,who,done){
  var fin=false,f=function(){if(!fin){fin=true;done()}};
  setTimeout(f,t.length*130/ (parseFloat($("sp").value)) +3500);
  try{
    var u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=parseFloat($("sp").value);
    var v=voices.length?voices[parseInt($(who=="A"?"sA":"sB").value)||0]:null;
    var g=v?gen(v):"?";
    u.pitch=g!="?"?1:(who=="A"?0.65:1.4);
    if(v)u.voice=v;
    u.onend=f;u.onerror=f;speechSynthesis.speak(u);
  }catch(e){setTimeout(f,t.length*90+800)}
}
function step(i,id){
  var L=D[cur].L;
  if(id!==run)return;
  if(i>=L.length){playing=false;$("pl").textContent="🔁 Nochmal";$("cA").classList.remove("talk");$("cB").classList.remove("talk");$("pi").style.width="100%";return}
  var w=L[i][0],t=L[i][1];
  [].forEach.call($("log").children,function(b){b.classList.add("old")});
  var b=document.createElement("div");b.className="b "+w+($("tx").checked?"":" hide");b.textContent=t;b.dataset.t=t;
  $("log").appendChild(b);b.scrollIntoView({block:"nearest",behavior:"smooth"});
  $("cA").classList.toggle("talk",w=="A");$("cB").classList.toggle("talk",w=="B");
  $("wA").classList.toggle("on",i==0||i==L.length-2);$("wB").classList.toggle("on",i==L.length-1||i==1&&false);
  $("pi").style.width=((i+1)/L.length*100)+"%";
  speak(t,w,function(){if(id===run)setTimeout(function(){step(i+1,id)},450)});
}
function start(){run++;playing=true;$("log").innerHTML="";$("pl").textContent="⏹ Stopp";step(0,run)}
$("pl").onclick=function(){if(playing){setup(cur)}else start()};
$("sw").onclick=function(){var a=$("sA").value;$("sA").value=$("sB").value;$("sB").value=a};
$("t1").onclick=function(){setup(0)};$("t2").onclick=function(){setup(1)};
$("tx").onchange=function(){[].forEach.call($("log").children,function(b){b.classList.toggle("hide",!$("tx").checked)})};
setup(0);
</script>
</body>
</html>
